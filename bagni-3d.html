<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4e1da;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#2b2824;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.tag{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));max-width:calc(100% - 170px);background:rgba(251,249,245,.9);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.4;color:#5d574f}
.tag b{display:block;font-size:14px;font-weight:600;color:#2b2824}
.tag #gap{display:block;font-size:12.5px;color:#2b2824;margin-bottom:2px}
#bHome{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top))}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
button{flex:0 0 auto;border:0;border-radius:999px;padding:10px 15px;font:inherit;font-size:14px;line-height:1;background:rgba(251,249,245,.93);color:#2b2824;cursor:pointer}
button.on{background:#34302b;color:#f7f3ec}
button:focus-visible{outline:2px solid #34302b;outline-offset:2px}
#info{position:fixed;left:12px;right:12px;bottom:calc(158px + env(safe-area-inset-bottom));max-width:380px;background:rgba(251,249,245,.96);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;color:#5d574f;display:none}
#info b{display:block;font-size:15px;font-weight:600;color:#2b2824;margin-bottom:2px}
#home{position:fixed;inset:0;z-index:5;background:#e9e6e0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#home[hidden]{display:none}
.h-in{max-width:780px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.h-in h1{font-size:25px;font-weight:650;letter-spacing:-0.01em;margin:0 0 6px}
.h-in p{margin:0 0 20px;font-size:14.5px;line-height:1.45;color:#5d574f}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;gap:12px;line-height:1.3;width:100%;padding:14px;border-radius:16px;background:#fbf9f5;text-align:left;white-space:normal;box-shadow:0 1px 2px rgba(40,35,30,.07)}
.card svg{display:block;width:100%;height:auto;border-radius:10px;background:#f0ede7}
.card b{display:block;line-height:1.3;font-size:17px;font-weight:600;color:#2b2824;margin-bottom:4px}
.card .d{display:block;font-size:13.5px;line-height:1.45;color:#5d574f}
.card .go{align-self:flex-start;background:#34302b;color:#f7f3ec;border-radius:999px;padding:9px 14px;font-size:13.5px;line-height:1}
#load{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#e4e1da;font-size:15px;color:#5d574f;padding:24px;text-align:center}
#load[hidden]{display:none}
.tag,#bHome,.bar,#info{transition:opacity .4s ease}
body.idle .tag,body.idle #bHome,body.idle .bar,body.idle #info{opacity:0;pointer-events:none}
</style>
</head>
<body>

          <rect x="170" y="134" width="40" height="30" rx="5" fill="#fff" stroke="#8a8278" stroke-width="1"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const pick=a=>a[Math.floor(rnd()*a.length)%a.length];
const H=2.50,GZ=0.12,GH=0.10;   /* ceiling 250 cm; light cove (gola) 12 cm deep, 10 cm high along the mirror wall */

function start(){
  if(!window.THREE){$('load').textContent='Non riesco a caricare il motore 3D: controlla la connessione e riapri il file.';return;}
  try{init();}catch(err){console.error(err);$('load').textContent='Errore nella preparazione del modello: '+err.message;}
}
window.addEventListener('load',()=>setTimeout(start,40));

function init(){
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.97;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
const aniso=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
const DAY=new THREE.Color(0xe4e1da),NIGHT=new THREE.Color(0x22252b);
scene.background=DAY.clone();
let R=null;   /* group of the room being built / shown */

/* ---------- canvas textures ---------- */
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function toTex(c,mw,mh,srgb){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb!==false)t.encoding=THREE.sRGBEncoding;t.anisotropy=aniso;t.repeat.set(1/mw,1/mh);return t;}
function grain(g,w,h,amt){const id=g.getImageData(0,0,w,h),d=id.data;for(let p=0;p<d.length;p+=4){const n=(Math.random()-0.5)*amt;d[p]+=n;d[p+1]+=n;d[p+2]+=n;}g.putImageData(id,0,0);}
function joints(g,w,h,cols,rows,col,gw){g.fillStyle=col;for(let i=0;i<=cols;i++)g.fillRect(i*w/cols-gw/2,0,gw,h);for(let j=0;j<=rows;j++)g.fillRect(0,j*h/rows-gw/2,w,gw);}

/* cement-look porcelain (Mirage Glocal): o.base/o.lt/o.dk rgb arrays, tiles 120 x 60 laid horizontally */
function cementTex(o){
  const pxm=853.333,w=Math.round(o.mw*pxm),h=Math.round(o.mh*pxm),c=mkC(w,h),g=c.getContext('2d');
  const cols=Math.round(o.mw/1.2),rows=Math.round(o.mh/0.6),tw=w/cols,th=h/rows;seed=o.seed;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const v=Math.round((rnd()-0.5)*o.tv);g.fillStyle='rgb('+(o.base[0]+v)+','+(o.base[1]+v)+','+(o.base[2]+v)+')';g.fillRect(i*tw,j*th,tw,th);}
  const n=Math.round(900*w*h/(2048*2048));
  for(let k=0;k<n;k++){
    const x=rnd()*w,y=rnd()*h,r=15+rnd()*150,l=rnd()>0.5,a=(0.02+rnd()*o.blot).toFixed(3);
    const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'rgba('+(l?o.lt:o.dk)+','+a+')');q.addColorStop(1,'rgba('+(l?o.lt:o.dk)+',0)');
    g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r);
  }
  g.lineWidth=1;const ns=Math.round(14000*w*h/(2048*2048));
  for(let k=0;k<ns;k++){
    const x=rnd()*w,y=rnd()*h,len=8+rnd()*70,an=(rnd()-0.5)*(o.brush?0.12:0.5);
    g.strokeStyle=rnd()>0.5?'rgba('+o.lt+',0.07)':'rgba('+o.dk+',0.055)';
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*len,y+Math.sin(an)*len);g.stroke();
  }
  grain(g,w,h,12);
  joints(g,w,h,cols,rows,o.grout,2.2);
  return toTex(c,o.mw,o.mh);
}

/* shower, first floor: oxidised metal look, corten and blue (as in the sample photo) */
function cortenTex(){
  const w=2048,h=1024,c=mkC(w,h),g=c.getContext('2d');seed=77;
  const strata=['139,82,44','166,102,50','96,70,50','72,88,102','150,148,138','118,76,44','60,74,88'];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    const x0=i*1024,y0=j*512;g.save();g.beginPath();g.rect(x0,y0,1024,512);g.clip();
    const bg=g.createLinearGradient(x0,y0,x0+1024,y0+512);
    bg.addColorStop(0,rnd()>0.5?'#5b666c':'#6a6258');bg.addColorStop(0.55,'#626a6e');bg.addColorStop(1,rnd()>0.5?'#55616a':'#6d6356');
    g.fillStyle=bg;g.fillRect(x0,y0,1024,512);
    for(let k=0;k<30;k++){
      const cx=x0+rnd()*1024,cyy=y0+rnd()*512,ry=10+rnd()*55,sx=3+rnd()*7,col=pick(strata),a=(0.16+rnd()*0.36).toFixed(2);
      g.save();g.translate(cx,cyy);g.rotate((rnd()-0.5)*0.22);g.scale(sx,1);
      const q=g.createRadialGradient(0,0,0,0,0,ry);q.addColorStop(0,'rgba('+col+','+a+')');q.addColorStop(1,'rgba('+col+',0)');
      g.fillStyle=q;g.fillRect(-ry,-ry,2*ry,2*ry);g.restore();
    }
    for(let v=0;v<8;v++){
      let x=x0-20,y=y0+rnd()*512;const dy=(rnd()-0.5)*0.35,col=rnd()>0.35?'214,176,104':'184,128,66';
      while(x<x0+1044){
        x+=2+rnd()*6;y+=dy*6+(rnd()-0.5)*5;
        const m=rnd()<0.35?3:1;
        for(let q=0;q<m;q++){g.fillStyle='rgba('+col+','+(0.3+rnd()*0.55).toFixed(2)+')';g.beginPath();g.arc(x+(rnd()-0.5)*16,y+(rnd()-0.5)*10,0.6+rnd()*rnd()*5,0,6.283);g.fill();}
      }
    }
    for(let k=0;k<2600;k++){g.fillStyle='rgba(206,170,102,'+(0.15+rnd()*0.4).toFixed(2)+')';g.beginPath();g.arc(x0+rnd()*1024,y0+rnd()*512,0.5+rnd()*1.8,0,6.283);g.fill();}
    for(let k=0;k<800;k++){g.fillStyle='rgba(34,30,28,'+(0.25+rnd()*0.4).toFixed(2)+')';g.fillRect(x0+rnd()*1024,y0+rnd()*512,1+rnd()*2,1+rnd()*1.5);}
    for(let k=0;k<9;k++){
      const cx=x0+rnd()*1024,cyy=y0+rnd()*512,ry=6+rnd()*18;
      g.save();g.translate(cx,cyy);g.scale(8+rnd()*10,1);
      const q=g.createRadialGradient(0,0,0,0,0,ry);q.addColorStop(0,'rgba(196,202,204,0.16)');q.addColorStop(1,'rgba(196,202,204,0)');
      g.fillStyle=q;g.fillRect(-ry,-ry,2*ry,2*ry);g.restore();
    }
    g.restore();
  }
  /* tonalita' piu' chiara richiesta per la zona doccia del primo piano */
  g.fillStyle='rgba(255,251,244,0.34)';g.fillRect(0,0,w,h);
  grain(g,w,h,12);
  joints(g,w,h,2,2,'#6d6a65',2);
  return toTex(c,2.4,1.2);
}

/* shower, ground floor: light cement with a faded baroque damask print (as in the sample photo) */
function leaf(g,x,y,len,wid,ang){g.save();g.translate(x,y);g.rotate(ang);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*0.35,-wid,len,-wid*0.25);g.quadraticCurveTo(len*0.55,wid*0.9,0,0);g.fill();g.restore();}
function spiral(g,cx,cy,r0,turns,dir,lw,a0){
  g.lineWidth=lw;g.beginPath();
  for(let k=0;k<=60;k++){const t=k/60,a=a0+dir*t*turns*6.283,r=r0*(1-0.78*t),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(k)g.lineTo(x,y);else g.moveTo(x,y);}
  g.stroke();
  for(let k=1;k<9;k++){const t=k/12,a=a0+dir*t*turns*6.283,r=r0*(1-0.78*t);leaf(g,cx+Math.cos(a)*r,cy+Math.sin(a)*r,r0*0.45*(1-t*0.85),r0*0.13*(1-t*0.6),a+dir*1.25);}
  const a=a0+dir*turns*6.283,r=r0*0.22;g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,lw*1.4,0,6.283);g.fill();
}
function motif(g,x,y,s,col){
  g.save();g.translate(x,y);g.strokeStyle=g.fillStyle='rgba('+col+',0.9)';g.lineCap='round';
  for(const side of [1,-1]){
    g.save();g.scale(side,1);
    spiral(g,s*0.26,-s*0.04,s*0.17,1.15,-1,s*0.016,Math.PI*0.9);
    spiral(g,s*0.19,s*0.29,s*0.11,1.0,1,s*0.012,-Math.PI*0.6);
    g.lineWidth=s*0.014;g.beginPath();g.moveTo(s*0.02,s*0.46);g.bezierCurveTo(s*0.1,s*0.22,s*0.36,s*0.27,s*0.33,s*0.05);g.stroke();
    for(let i=0;i<5;i++)leaf(g,s*0.03,-s*0.22,s*(0.24-i*0.025),s*0.04,-1.45+i*0.24);
    for(let i=0;i<6;i++){g.beginPath();g.arc(s*(0.38+Math.cos(i)*0.04),-s*(0.3+Math.sin(i*1.7)*0.04),s*0.012,0,6.283);g.fill();}
    leaf(g,s*0.05,s*0.1,s*0.2,s*0.05,0.35);
    g.restore();
  }
  for(let i=0;i<7;i++)leaf(g,0,-s*0.16,s*(0.2-Math.abs(i-3)*0.03),s*0.035,-Math.PI/2+(i-3)*0.2);
  g.beginPath();g.moveTo(0,-s*0.05);g.bezierCurveTo(s*0.09,s*0.02,s*0.07,s*0.16,0,s*0.2);g.bezierCurveTo(-s*0.07,s*0.16,-s*0.09,s*0.02,0,-s*0.05);g.fill();
  g.restore();
}
function sprig(g,x,y,s,col,rot){
  g.save();g.translate(x,y);g.rotate(rot);g.strokeStyle=g.fillStyle='rgba('+col+',0.85)';g.lineCap='round';
  g.lineWidth=s*0.03;g.beginPath();g.moveTo(0,s*0.5);g.quadraticCurveTo(s*0.2,0,0,-s*0.5);g.stroke();
  for(let i=0;i<6;i++){const t=i/6,yy=s*(0.4-t*0.85);leaf(g,s*0.06,yy,s*0.28*(1-t*0.5),s*0.07,-0.6);leaf(g,-s*0.02,yy-s*0.05,s*0.25*(1-t*0.5),s*0.07,Math.PI+0.6);}
  g.restore();
}
function damaskTex(){
  const w=2048,h=1024,c=mkC(w,h),g=c.getContext('2d');seed=41;
  g.fillStyle='#d8d5ce';g.fillRect(0,0,w,h);
  for(let k=0;k<520;k++){const x=rnd()*w,y=rnd()*h,r=20+rnd()*160,l=rnd()>0.45,a=(0.03+rnd()*0.07).toFixed(3);
    const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,l?'rgba(246,244,240,'+a+')':'rgba(150,146,138,'+a+')');q.addColorStop(1,'rgba(200,196,188,0)');g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r);}
  g.lineWidth=1;for(let k=0;k<5000;k++){const x=rnd()*w,y=rnd()*h,len=6+rnd()*50;g.strokeStyle=rnd()>0.5?'rgba(250,249,246,0.08)':'rgba(120,116,108,0.06)';g.beginPath();g.moveTo(x,y);g.lineTo(x+len,y+(rnd()-0.5)*6);g.stroke();}
  const o=mkC(w,h),og=o.getContext('2d');
  const cols=['118,110,98','132,102,74','88,100,112','104,97,88','140,120,96'];
  const cw=512,nc=4,nr=2;
  for(let i=-1;i<=nc;i++)for(let j=-1;j<=nr;j++){
    const im=((i%nc)+nc)%nc,jm=((j%nr)+nr)%nr;seed=1000+im*17+jm*131;
    const x=i*cw+cw/2,y=j*cw+cw/2+((im%2)?cw/2:0);
    motif(og,x,y,cw*0.9,pick(cols));
    sprig(og,x+cw/2,y,cw*0.34,pick(cols),(rnd()-0.5)*0.8);
    sprig(og,x+cw/2,y+cw/2,cw*0.26,pick(cols),Math.PI+(rnd()-0.5)*0.8);
  }
  seed=4242;og.globalCompositeOperation='destination-out';

const NS=96;

function ringX(y,cx,a,zb,zf,nF,nB){const r=[];for(let k=0;k<NS;k++){const p=sup(a,zb,zf,k/NS*Math.PI*2,nF,nB);r.push(cx+p[0],y,p[1]);}return r;}

/* ---------- distanze in pianta su sagome reali (poligoni), non su bounding box ---------- */
const rectPoly=r=>[[r[0],r[2]],[r[1],r[2]],[r[1],r[3]],[r[0],r[3]]];
function ptSeg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy;let t=L?((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*vx,p[1]-a[1]-t*vy);}
function segSeg(p,q,r,t){
  const d1=[q[0]-p[0],q[1]-p[1]],d2=[t[0]-r[0],t[1]-r[1]],den=d1[0]*d2[1]-d1[1]*d2[0];
  if(Math.abs(den)>1e-12){
    const a=((r[0]-p[0])*d2[1]-(r[1]-p[1])*d2[0])/den,b=((r[0]-p[0])*d1[1]-(r[1]-p[1])*d1[0])/den;
    if(a>=0&&a<=1&&b>=0&&b<=1)return 0;
  }
  return Math.min(ptSeg(p,r,t),ptSeg(q,r,t),ptSeg(r,p,q),ptSeg(t,p,q));
}
function polyDist(A,B){
  let d=Infinity;
  for(let i=0;i<A.length;i++){const a0=A[i],a1=A[(i+1)%A.length];
    for(let j=0;j<B.length;j++){d=Math.min(d,segSeg(a0,a1,B[j],B[(j+1)%B.length]));if(d===0)return 0;}}
  return d;
}
/* come ptSeg, ma restituisce anche il punto sul segmento più vicino a p (non solo la distanza) */
function ptSegPoint(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy;let t=L?((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L:0;t=Math.max(0,Math.min(1,t));return [a[0]+t*vx,a[1]+t*vy];}
/* come segSeg, ma restituisce anche la coppia di punti (uno per segmento) che realizza la distanza minima */
function segSegPts(p,q,r,t){
  const d1=[q[0]-p[0],q[1]-p[1]],d2=[t[0]-r[0],t[1]-r[1]],den=d1[0]*d2[1]-d1[1]*d2[0];
  if(Math.abs(den)>1e-12){
    const a=((r[0]-p[0])*d2[1]-(r[1]-p[1])*d2[0])/den,b=((r[0]-p[0])*d1[1]-(r[1]-p[1])*d1[0])/den;
    if(a>=0&&a<=1&&b>=0&&b<=1){const ix=p[0]+a*d1[0],iy=p[1]+a*d1[1];return {d:0,p1:[ix,iy],p2:[ix,iy]};}
  }
  const cands=[
    {d:ptSeg(p,r,t),p1:p,p2:ptSegPoint(p,r,t)},
    {d:ptSeg(q,r,t),p1:q,p2:ptSegPoint(q,r,t)},
    {d:ptSeg(r,p,q),p1:ptSegPoint(r,p,q),p2:r},
    {d:ptSeg(t,p,q),p1:ptSegPoint(t,p,q),p2:t}
  ];
  return cands.reduce((best,c)=>c.d<best.d?c:best);
}
/* come polyDist, ma restituisce anche i due punti reali (uno per poligono) più vicini fra loro */
function polyDistPts(A,B){
  let best={d:Infinity,p1:null,p2:null};
  for(let i=0;i<A.length;i++){const a0=A[i],a1=A[(i+1)%A.length];
    for(let j=0;j<B.length;j++){
      const r=segSegPts(a0,a1,B[j],B[(j+1)%B.length]);
      if(r.d<best.d){best=r;if(best.d===0)return best;}
    }}
  return best;
}

/* ==================================================================
   Generatore DXF: calcola pianta e 4 prospetti direttamente dai
   parametri geometrici usati per costruire il modello 3D (nessun
   disegno precalcolato: se cambiano le misure qui sopra, il DXF si
   aggiorna da solo). Unità di lavoro: metri in ingresso, cm nel DXF.
   ================================================================== */
function dxfBuilder(){
  const ents=[];let xmin=Infinity,ymin=Infinity,xmax=-Infinity,ymax=-Infinity;
  const trk=(x,y)=>{if(x<xmin)xmin=x;if(x>xmax)xmax=x;if(y<ymin)ymin=y;if(y>ymax)ymax=y;};
  const n=v=>(Math.round(v*1000)/1000).toFixed(3);
  const esc=s=>String(s).replace(/[\r\n]/g,' ');
  const B={
    line(layer,x1,y1,x2,y2){trk(x1,y1);trk(x2,y2);ents.push('0\nLINE\n8\n'+layer+'\n10\n'+n(x1)+'\n20\n'+n(y1)+'\n30\n0.0\n11\n'+n(x2)+'\n21\n'+n(y2)+'\n31\n0.0');},
    circle(layer,cx,cy,r){trk(cx-r,cy-r);trk(cx+r,cy+r);ents.push('0\nCIRCLE\n8\n'+layer+'\n10\n'+n(cx)+'\n20\n'+n(cy)+'\n30\n0.0\n40\n'+n(r));},
    text(layer,x,y,h,str){trk(x,y);ents.push('0\nTEXT\n8\n'+layer+'\n10\n'+n(x)+'\n20\n'+n(y)+'\n30\n0.0\n40\n'+n(h)+'\n1\n'+esc(str)+'\n50\n0.0');},
    rect(layer,x0,y0,x1,y1){B.line(layer,x0,y0,x1,y0);B.line(layer,x1,y0,x1,y1);B.line(layer,x1,y1,x0,y1);B.line(layer,x0,y1,x0,y0);},
    poly(layer,pts,closed){for(let i=0;i<pts.length-1;i++)B.line(layer,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);if(closed&&pts.length>1)B.line(layer,pts[pts.length-1][0],pts[pts.length-1][1],pts[0][0],pts[0][1]);},
    build(){
      const LAYERS=[['MURI',7],['ARREDO',3],['SANITARI',4],['DOCCIA',5],['RIVEST',8],['APERTURE',6],['QUOTE',1],['TESTI',2]];
      const ld=LAYERS.map(l=>'0\nLAYER\n2\n'+l[0]+'\n70\n0\n62\n'+l[1]+'\n6\nCONTINUOUS').join('\n');
      if(xmin===Infinity){xmin=ymin=xmax=ymax=0;}
      return '0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n9\n$INSUNITS\n70\n5\n9\n$EXTMIN\n10\n'+n(xmin)+'\n20\n'+n(ymin)+'\n30\n0.0\n9\n$EXTMAX\n10\n'+n(xmax)+'\n20\n'+n(ymax)+'\n30\n0.0\n0\nENDSEC\n'
        +'0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n8\n'+ld+'\n0\nENDTAB\n0\nENDSEC\n'
        +'0\nSECTION\n2\nENTITIES\n'+ents.join('\n')+'\n0\nENDSEC\n0\nEOF\n';
    }
  };
  return B;
}

/* geometria delle 4 pareti in pianta: punto di partenza, direzione (asse lungo cui
   corre la parete) e normale uscente (verso l'esterno) — usata sia per gli sguinci
   delle aperture in pianta, sia per convertire x,z in coordinata "u" di prospetto */
function wallGeom(W,D){
  return {
    A:{p0:[0,0],dir:[1,0],normal:[0,-1]},
    B:{p0:[0,D],dir:[1,0],normal:[0, 1]},
    L:{p0:[0,0],dir:[0,1],normal:[-1,0]},
    R:{p0:[W,0],dir:[0,1],normal:[ 1,0]}
  };
}
/* coordinata orizzontale "u" di un punto (x,z) nel prospetto della parete indicata,
   guardando la parete da dentro la stanza (stessa convenzione usata da wallPlane) */
function wallU(wall,W,D,x,z){
  switch(wall){case 'A':return x;case 'B':return W-x;case 'L':return D-z;default:return z;}
}
/* proietta l'ingombro in pianta (poligono di punti [x,z]) sulla parete indicata,
   se e solo se la tocca: usato per mettere in automatico in prospetto mobili,
   box doccia e colonne, senza doverli ridescrivere a mano */
function footprintOnWall(poly,W,D,wall){
  const xs=poly.map(p=>p[0]),zs=poly.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs),EPS=0.03;
  if(wall==='A'&&z0<=EPS)return {u0:x0,u1:x1};
  if(wall==='B'&&(D-z1)<=EPS)return {u0:W-x1,u1:W-x0};
  if(wall==='L'&&x0<=EPS)return {u0:D-z1,u1:D-z0};
  if(wall==='R'&&(W-x1)<=EPS)return {u0:z0,u1:z1};
  return null;
}
function polyCenter(poly){let sx=0,sz=0;poly.forEach(p=>{sx+=p[0];sz+=p[1];});return [sx/poly.length,sz/poly.length];}

function dxfOpening(B,X,Y,g,o){
  const width=o.to-o.from;
  const ptAt=s=>[g.p0[0]+g.dir[0]*s,g.p0[1]+g.dir[1]*s];
  const iF=ptAt(o.from),iT=ptAt(o.to);
  const eF=[iF[0]+g.normal[0]*o.wallThk,iF[1]+g.normal[1]*o.wallThk];
  const eT=[iT[0]+g.normal[0]*o.wallThk,iT[1]+g.normal[1]*o.wallThk];
  B.line('APERTURE',X(iF[0]),Y(iF[1]),X(eF[0]),Y(eF[1]));
  B.line('APERTURE',X(iT[0]),Y(iT[1]),X(eT[0]),Y(eT[1]));
  B.line('APERTURE',X(eF[0]),Y(eF[1]),X(eT[0]),Y(eT[1]));
  if(o.type==='door'){
    const tip=[iF[0]-g.normal[0]*width,iF[1]-g.normal[1]*width];
    B.line('APERTURE',X(iF[0]),Y(iF[1]),X(tip[0]),Y(tip[1]));
    B.line('APERTURE',X(tip[0]),Y(tip[1]),X(iT[0]),Y(iT[1]));
  }
  const mid=[(eF[0]+eT[0])/2,(eF[1]+eT[1])/2];
  B.text('QUOTE',X(mid[0])-6,Y(mid[1])+4,3,Math.round(width*100)+' cm');
}

function dxfPlan(B,ox,oy,m){
  const {W,D,wallThk:t,openings,dxfFurn,shower,sanitary,cfgLabel}=m;
  const X=x=>ox+x*100+t*100,Y=z=>oy+z*100+t*100;
  B.rect('MURI',ox,oy,ox+(W+2*t)*100,oy+(D+2*t)*100);
  B.rect('MURI',X(0),Y(0),X(W),Y(D));
  const g=wallGeom(W,D);
  openings.forEach(o=>dxfOpening(B,X,Y,g[o.wall],Object.assign({wallThk:t},o)));
  dxfFurn.forEach(it=>B.poly('ARREDO',it.poly.map(p=>[X(p[0]),Y(p[1])]),true));
  B.poly('DOCCIA',shower.map(p=>[X(p[0]),Y(p[1])]),true);
  const sc=polyCenter(shower);B.circle('DOCCIA',X(sc[0]),Y(sc[1]),4);
  sanitary.forEach(s=>{
    const x0=s.cx-s.w/2,x1=s.cx+s.w/2,z0=s.cz,z1=s.cz+s.d;
    B.rect('SANITARI',X(x0),Y(z0),X(x1),Y(z1));
    B.text('TESTI',X(x0)+2,Y(z0)+2,3.5,s.label);
  });
  const tk2=4;
  B.line('QUOTE',X(0),Y(0)-15,X(W),Y(0)-15);B.line('QUOTE',X(0),Y(0)-15-tk2,X(0),Y(0)-15+tk2);B.line('QUOTE',X(W),Y(0)-15-tk2,X(W),Y(0)-15+tk2);
  B.text('QUOTE',X(W/2)-10,Y(0)-13,4,Math.round(W*100)+' cm');
  B.line('QUOTE',X(0)-15,Y(0),X(0)-15,Y(D));B.line('QUOTE',X(0)-15-tk2,Y(0),X(0)-15+tk2,Y(0));B.line('QUOTE',X(0)-15-tk2,Y(D),X(0)-15+tk2,Y(D));
  B.text('QUOTE',X(0)-32,Y(D/2),4,Math.round(D*100)+' cm');
  B.text('TESTI',ox,oy+(D+2*t)*100+8,6,cfgLabel+' — pianta');
  return {w:(W+2*t)*100,h:(D+2*t)*100};
}

function dxfElevation(B,ox,oy,m,wall){
  const {W,D,ceilH,openings,dxfFurn,shower,sanitary,wallItems,cfgLabel,showerGlassH}=m;
  const span=(wall==='A'||wall==='B')?W:D;
  const U=u=>ox+u*100,V=v=>oy+v*100;
  B.rect('MURI',ox,oy,ox+span*100,oy+ceilH*100);
  openings.filter(o=>o.wall===wall).forEach(o=>{
    let u0=wallU(wall,W,D,o.from,o.from),u1=wallU(wall,W,D,o.to,o.to);
    if(u0>u1){const t2=u0;u0=u1;u1=t2;}
    B.rect('APERTURE',U(u0),V(o.y0),U(u1),V(o.y1));
  });
  sanitary.filter(s=>s.wall===wall).forEach(s=>{
    const u0=s.cx-s.w/2,u1=s.cx+s.w/2;
    B.rect('SANITARI',U(u0),V(s.y0),U(u1),V(s.y1));
    B.text('TESTI',U(u0)+2,V(s.y1)+3,3.5,s.label);
  });
  const items=dxfFurn.map(it=>({poly:it.poly,y0:it.y0,y1:it.y1,label:it.label,layer:'ARREDO'}))
    .concat([{poly:shower,y0:0.03,y1:showerGlassH||1.985,label:'Box doccia',layer:'DOCCIA'}]);
  items.forEach(it=>{
    const box=footprintOnWall(it.poly,W,D,wall);
    if(box){B.rect(it.layer,U(box.u0),V(it.y0),U(box.u1),V(it.y1));B.text('TESTI',U(box.u0)+2,V(it.y1)+3,3.5,it.label);}
  });
  wallItems.filter(it=>it.wall===wall).forEach(it=>{
    B.rect(it.layer||'ARREDO',U(it.u0),V(it.v0),U(it.u1),V(it.v1));
    B.text('TESTI',U(it.u0)+2,V(it.v1)+3,3.5,it.label);
  });
  B.text('TESTI',ox,oy+ceilH*100+8,6,cfgLabel+' — prospetto '+wall);
}

/* punto di ingresso: costruisce l'intero disegno (pianta + 4 prospetti) a partire
   dal modello descrittivo attaccato alla stanza corrente (room.dxf) */
function generateDXF(m){
  const B=dxfBuilder(),GAP=60;
  let ox=0;
  const plan=dxfPlan(B,ox,0,m);
  ox+=plan.w+GAP;
  ['A','B','L','R'].forEach(w=>{
    const span=(w==='A'||w==='B')?m.W:m.D;
    dxfElevation(B,ox,0,m,w);
    ox+=span*100+GAP;
  });
  B.text('TESTI',0,plan.h+40,9,m.cfgLabel);
  B.text('TESTI',0,plan.h+24,4.5,'Disegno generato automaticamente dal modello 3D — quote in cm');
  return B.build();
}

/* ---------- room scaffolding shared by both bathrooms ---------- */
function makeWalls(W,D){
  const walls={},tests={A:p=>p.z<-0.02,B:p=>p.z>D+0.02,L:p=>p.x<-0.02,R:p=>p.x>W+0.02,C:p=>p.y>H-0.02};
  for(const k in tests){const g=new THREE.Group();R.add(g);walls[k]={g:g,test:tests[k],hidden:false};}
  return walls;
}
/* wall covering: s along the wall in world units, notches [s0,s1,yFrom] cut from the top edge (window reveals) */
function wallPlane(ctx,w,s0,s1,y0,y1,mat,info,notches){
  const off=0.006,L0=w==='B'?ctx.W:ctx.D,rev=(w==='B'||w==='L');
  const u0=rev?L0-s1:s0,u1=rev?L0-s0:s1;
  const pts=[[u0,y0],[u1,y0],[u1,y1]];
  (notches||[]).map(n=>rev?[L0-n[1],L0-n[0],n[2]]:[n[0],n[1],n[2]]).sort((a,b)=>b[0]-a[0]).forEach(n=>{pts.push([n[1],y1],[n[1],n[2]],[n[0],n[2]],[n[0],y1]);});
  pts.push([u0,y1]);

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();

function pickAt(x,y){
  if(!cur)return;
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObject(cur.R,true);
  for(const h of hits){
    if(!h.object.layers.test(cam.layers)||!h.object.visible)continue;
    let o=h.object;while(o&&!o.userData.info&&!o.userData.winIdx)o=o.parent;
    if(o){
      let w=o;while(w&&!w.userData.winIdx)w=w.parent;
      if(w)toggleWin(w.userData.winIdx);
      if(o.userData.info)showInfo(o.userData.info);

    }

}

const pts=new Map();let lastD=0,lastC=null,moved=0;
canvas.addEventListener('pointerdown',e=>{
  if(!cur)return;
  if(pts.size===0)revealTap=idle;
  canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tw){tw=null;}syncSph();
  if(pts.size===1)moved=0;
  if(pts.size===2){const q=[...pts.values()];lastD=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);lastC={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};moved=99;}
});

  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){sph.theta-=dx*0.006;sph.phi-=dy*0.006;applySph();}}
  else if(pts.size===2){
    const q=[...pts.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),c={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};

function projectToPixel(x,y,z,pw,ph){

/* disegna sul context 2d una quota (linea + tacche + etichetta in cm) fra due punti pixel */
function drawQuote(ctx,a,b,dMeters){
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,tick=8;
  ctx.save();
  ctx.strokeStyle='#e23d28';ctx.fillStyle='#e23d28';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  [a,b].forEach(p=>{
    ctx.beginPath();ctx.moveTo(p[0]-nx*tick,p[1]-ny*tick);ctx.lineTo(p[0]+nx*tick,p[1]+ny*tick);ctx.stroke();
    ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fill();
  });
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,label=(Math.round(dMeters*1000)/10).toFixed(0)+' cm';
  ctx.font='bold 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
  const tw=ctx.measureText(label).width,padX=10,padY=7,bw=tw+2*padX,bh=28+2*(padY-7);
  ctx.fillStyle='rgba(251,249,245,0.94)';ctx.fillRect(mx-bw/2,my-bh/2,bw,bh);
  ctx.strokeStyle='#e23d28';ctx.lineWidth=1.5;ctx.strokeRect(mx-bw/2,my-bh/2,bw,bh);
  ctx.fillStyle='#e23d28';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,mx,my+1);
  ctx.restore();
}
/* esporta la vista in pianta corrente come immagine PNG, con la quota reale (in cm) fra i due

}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(!cur||!$('home').hidden)return;
  if(tw){
    const k=Math.min(1,(now-tw.s)/900),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    cam.position.lerpVectors(tw.p0,tw.p1,e);tgt.lerpVectors(tw.t0,tw.t1,e);cam.fov=tw.f0+(tw.f1-tw.f0)*e;cam.updateProjectionMatrix();cam.lookAt(tgt);applyCut();dirty=true;
    if(k>=1){tw=null;syncSph();}
  }
  const a=cur.anim;
  if(a.doorT!==a.doorGoal){
    a.doorT=a.doorGoal>a.doorT?Math.min(a.doorGoal,a.doorT+dt/0.9):Math.max(a.doorGoal,a.doorT-dt/0.9);
    cur.showerAnim(ss(0,1,a.doorT));dirty=true;
    if(a.doorT===a.doorGoal){updateShadows();capture();}
  }
  if(a.rdT!==a.rdGoal){
    a.rdT=a.rdGoal>a.rdT?Math.min(a.rdGoal,a.rdT+dt/1.1):Math.max(a.rdGoal,a.rdT-dt/1.1);
    cur.doorAnim(ss(0,1,a.rdT));dirty=true;
    if(a.rdT===a.rdGoal){updateShadows();capture();}
  }
  for(let i=1;i<=2;i++){
    const fn=(cur.winAnim||[])[i-1];if(!fn)continue;
    const kt='w'+i+'T',kg='w'+i+'Goal';
    if(a[kt]!==a[kg]){
      a[kt]=a[kg]>a[kt]?Math.min(a[kg],a[kt]+dt/1.2):Math.max(a[kg],a[kt]-dt/1.2);
      fn(ss(0,1,a[kt]));dirty=true;
      if(a[kt]===a[kg]){updateShadows();capture();}
    }
  }
  if(dirty){renderer.render(scene,cam);dirty=false;}
}
$('load').hidden=true;
requestAnimationFrame(loop);
}
})();
</script>
