<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>I due bagni – modello 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4e1da;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#2b2824;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.tag{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));max-width:calc(100% - 170px);background:rgba(251,249,245,.9);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.4;color:#5d574f}
.tag b{display:block;font-size:14px;font-weight:600;color:#2b2824}
.tag #gap{display:block;font-size:12.5px;color:#2b2824;margin-bottom:2px}
#bHome{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top))}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
button{flex:0 0 auto;border:0;border-radius:999px;padding:10px 15px;font:inherit;font-size:14px;line-height:1;background:rgba(251,249,245,.93);color:#2b2824;cursor:pointer}
button.on{background:#34302b;color:#f7f3ec}
button:focus-visible{outline:2px solid #34302b;outline-offset:2px}
#info{position:fixed;left:12px;right:12px;bottom:calc(158px + env(safe-area-inset-bottom));max-width:380px;background:rgba(251,249,245,.96);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;color:#5d574f;display:none}
#info b{display:block;font-size:15px;font-weight:600;color:#2b2824;margin-bottom:2px}
#home{position:fixed;inset:0;z-index:5;background:#e9e6e0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#home[hidden]{display:none}
.h-in{max-width:780px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.h-in h1{font-size:25px;font-weight:650;letter-spacing:-0.01em;margin:0 0 6px}
.h-in p{margin:0 0 20px;font-size:14.5px;line-height:1.45;color:#5d574f}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;gap:12px;line-height:1.3;width:100%;padding:14px;border-radius:16px;background:#fbf9f5;text-align:left;white-space:normal;box-shadow:0 1px 2px rgba(40,35,30,.07)}
.card svg{display:block;width:100%;height:auto;border-radius:10px;background:#f0ede7}
.card b{display:block;line-height:1.3;font-size:17px;font-weight:600;color:#2b2824;margin-bottom:4px}
.card .d{display:block;font-size:13.5px;line-height:1.45;color:#5d574f}
.card .go{align-self:flex-start;background:#34302b;color:#f7f3ec;border-radius:999px;padding:9px 14px;font-size:13.5px;line-height:1}
#load{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#e4e1da;font-size:15px;color:#5d574f;padding:24px;text-align:center}
#load[hidden]{display:none}
.tag,#bHome,.bar,#info{transition:opacity .4s ease}
body.idle .tag,body.idle #bHome,body.idle .bar,body.idle #info{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag"><b id="title">Bagno</b><span id="gap"></span>Trascina per ruotare, pizzica per lo zoom, tocca un elemento per i dettagli</div>
<button id="bHome">Cambia bagno</button>
<div id="info"><b id="it"></b><span id="is"></span></div>
<div class="bar">
  <div class="row" id="views">
    <button data-v="ingresso" class="on">Ingresso</button>
    <button data-v="lavabo">Lavabo</button>
    <button data-v="doccia">Doccia</button>
    <button data-v="pianta">Pianta</button>
    <button data-v="d3">Vista 3D</button>
  </div>
  <div class="row" id="cfgs">
    <button data-cfg="1" class="on">Config. 1</button>
    <button data-cfg="2">Config. 2</button>
    <button data-cfg="3">Config. 3</button>
    <button id="bDxf">Scarica DXF</button>
  </div>
  <div class="row">
    <button id="bDoor">Apri box doccia</button>
    <button id="bRoom">Apri porta</button>
    <button id="bWin1">Apri finestra</button>
    <button id="bWin2">Apri anta 2</button>
    <button id="bNight">Luce serale</button>
  </div>
</div>
<div id="home">
  <div class="h-in">
    <h1>I due bagni</h1>
    <p>Scegli quale bagno aprire nel modello 3D. Puoi passare all’altro in qualsiasi momento con “Cambia bagno”.</p>
    <div class="cards">
      <button class="card" data-room="terra">
        <svg viewBox="-20 -18 272 228" aria-hidden="true">
          <rect x="152" y="0" width="80" height="100" fill="#dde5e6"/>
          <rect x="0" y="182" width="10" height="10" fill="#cfc9c0"/>
          <rect x="28" y="0" width="36" height="52" rx="9" fill="#fff" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="94" y="0" width="36" height="52" rx="9" fill="#fff" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="25" y="148" width="100" height="44" fill="#d9c7b3" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="52" y="154" width="40" height="30" rx="5" fill="#fff" stroke="#8a8278" stroke-width="1"/>
          <rect x="158" y="186" width="52" height="5" fill="#fff" stroke="#8a8278" stroke-width="1"/>
          <path d="M152 55 V100 H194" fill="none" stroke="#8a8278" stroke-width="1.2"/>
          <path d="M0 0 H232 V102 M232 182 V192 H0 V62 M0 14 V0" fill="none" stroke="#4a443d" stroke-width="3.2"/>
          <path d="M-4 14 V62 M4 14 V62" stroke="#8fb0c4" stroke-width="1.6"/>
        </svg>
        <span><b>Bagno piano terra</b><span class="d">232 × 192 cm al filo finito · vaso e bidet a terra TEN 4.0 · 3 configurazioni: MOON 043 da 100, da 80 o due mensole in legno</span></span>
        <span class="go">Apri il bagno</span>
      </button>
      <button class="card" data-room="primo">
        <svg viewBox="-20 -18 307 208" aria-hidden="true">
          <rect x="0" y="0" width="110" height="75" fill="#c9b3a2"/>
          <rect x="135.5" y="0" width="37" height="52" rx="9" fill="#fff" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="201.5" y="0" width="37" height="52" rx="9" fill="#fff" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="257" y="0" width="10" height="10" fill="#cfc9c0"/>
          <rect x="143" y="128" width="100" height="44" fill="#cfc8bf" stroke="#8a8278" stroke-width="1.2"/>
          <rect x="170" y="134" width="40" height="30" rx="5" fill="#fff" stroke="#8a8278" stroke-width="1"/>
          <rect x="93" y="168" width="30" height="4" fill="#fff" stroke="#8a8278" stroke-width="1"/>
          <path d="M0 75 H110 V0" fill="none" stroke="#8a8278" stroke-width="1.2"/>
          <path d="M0 84 V0 H267 V38 M267 138 V172 H0 V164" fill="none" stroke="#4a443d" stroke-width="3.2"/>
          <path d="M263 38 V138 M271 38 V138" stroke="#8fb0c4" stroke-width="1.6"/>
        </svg>
        <span><b>Bagno primo piano</b><span class="d">267 × 172 cm al filo finito · sanitari sospesi File 2.0 · 3 configurazioni: doccia 110×75 o 100×80, mobile da 100 o 80</span></span>
        <span class="go">Apri il bagno</span>
      </button>
    </div>
  </div>
</div>
<div id="load">Carico il motore 3D…</div>

/* ---------- distanze in pianta su sagome reali (poligoni), non su bounding box ---------- */
const rectPoly=r=>[[r[0],r[2]],[r[1],r[2]],[r[1],r[3]],[r[0],r[3]]];
function ptSeg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy;let t=L?((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*vx,p[1]-a[1]-t*vy);}
function segSeg(p,q,r,t){
  const d1=[q[0]-p[0],q[1]-p[1]],d2=[t[0]-r[0],t[1]-r[1]],den=d1[0]*d2[1]-d1[1]*d2[0];
  if(Math.abs(den)>1e-12){
    const a=((r[0]-p[0])*d2[1]-(r[1]-p[1])*d2[0])/den,b=((r[0]-p[0])*d1[1]-(r[1]-p[1])*d1[0])/den;
    if(a>=0&&a<=1&&b>=0&&b<=1)return 0;
  }
  return Math.min(ptSeg(p,r,t),ptSeg(q,r,t),ptSeg(r,p,q),ptSeg(t,p,q));
}
function polyDist(A,B){
  let d=Infinity;
  for(let i=0;i<A.length;i++){const a0=A[i],a1=A[(i+1)%A.length];
    for(let j=0;j<B.length;j++){d=Math.min(d,segSeg(a0,a1,B[j],B[(j+1)%B.length]));if(d===0)return 0;}}
  return d;
}

/* wall covering: s along the wall in world units, notches [s0,s1,yFrom] cut from the top edge (window reveals) */
function wallPlane(ctx,w,s0,s1,y0,y1,mat,info,notches){

    winAnim:[e=>{sashes[0].rotation.y=-Math.PI/2*e;},e=>{sashes[1].rotation.y=Math.PI+Math.PI/2*e;}],
    views:{
      ingresso:{p:[0.18,1.60,1.32],t:[1.5,1.02,0.40],f:70,interior:true},
      lavabo:{p:[VC-0.13,1.55,0.30],t:[VC,1.05,1.75],f:66,interior:true},
      doccia:{p:[2.55,1.62,1.20],t:[0.55,1.0,0.35],f:66,interior:true},
      pianta:{p:[W/2,10,D/2+0.02],t:[W/2,0,D/2],f:30,fit:[1.7,1.2],top:true},
      d3:{p:[4.4,3.6,4.0],t:[1.35,0.7,0.85],f:38,fit:[2.2,1.8]}
    }
  };
}

/* ---------- environment ---------- */
const pmrem=new THREE.PMREMGenerator(renderer);
const envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.BoxGeometry(6,4,6),new THREE.MeshBasicMaterial({color:0x9a948a,side:THREE.BackSide})));
const ep=(w,h,x,y,z,rx,ry,col)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.set(rx,ry,0);envScene.add(m);};
ep(2,2,0,1.95,0,Math.PI/2,0,new THREE.Color(4,3.8,3.5));
ep(1.5,2,-2.95,0.3,0.5,0,Math.PI/2,new THREE.Color(3,3.2,3.4));
ep(5,5,0,-1.95,0,-Math.PI/2,0,new THREE.Color(0.55,0.5,0.43));
scene.environment=pmrem.fromScene(envScene,0.04).texture;

/* ---------- camera + cutaway ---------- */
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.03,80);
const tgt=new THREE.Vector3();const sph=new THREE.Spherical();
const rooms={};let cur=null,curKey='terra',curCfg=1;
let dirty=true,tw=null,curView='ingresso',night=false,envTarget=null;
function setL(o,l){o.traverse(x=>x.layers.set(l));}
function showAll(){for(const k in cur.walls){setL(cur.walls[k].g,0);cur.walls[k].hidden=false;}}
function applyCut(force){if(!cur)return;const p=cam.position;for(const k in cur.walls){const w=cur.walls[k],h=w.test(p);if(force||h!==w.hidden){w.hidden=h;setL(w.g,h?1:0);}}}
const tiny=new THREE.WebGLRenderTarget(1,1);
function updateShadows(){showAll();cur.R.updateMatrixWorld(true);renderer.shadowMap.needsUpdate=true;renderer.setRenderTarget(tiny);renderer.render(scene,cam);renderer.setRenderTarget(null);applyCut(true);dirty=true;}
function capture(){
  showAll();cur.R.updateMatrixWorld(true);
  const tm=renderer.toneMapping;renderer.toneMapping=THREE.NoToneMapping;
  cur.mirror.visible=false;cur.mirCam.update(renderer,scene);cur.mirror.visible=true;
  cur.envCam.update(renderer,scene);
  const ne=pmrem.fromCubemap(cur.envRT.texture);
  renderer.toneMapping=tm;
  if(envTarget)envTarget.dispose();envTarget=ne;scene.environment=ne.texture;
  applyCut(true);dirty=true;
}
function viewParams(name){
  const a=innerWidth/innerHeight,v=cur.views[name];
  let f=v.f;if(v.interior&&a<1)f=Math.min(92,v.f+(1-a)*42);
  const p=new THREE.Vector3().fromArray(v.p),t=new THREE.Vector3().fromArray(v.t);
  if(v.fit){
    const dir=p.clone().sub(t).normalize(),vt=Math.tan(THREE.MathUtils.degToRad(f/2)),ht=vt*a;
    let dist=Math.max(v.fit[1]/vt,v.fit[0]/ht);if(v.top)dist+=H;
    p.copy(t).addScaledVector(dir,dist);
  }
  return {p:p,t:t,f:f};
}
function markView(name){document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===name));}
function goView(name,instant){
  curView=name;markView(name);hideInfo();
  const v=viewParams(name);
  if(instant){cam.position.copy(v.p);tgt.copy(v.t);cam.fov=v.f;cam.updateProjectionMatrix();cam.lookAt(tgt);syncSph();applyCut();tw=null;dirty=true;}
  else tw={p0:cam.position.clone(),t0:tgt.clone(),f0:cam.fov,p1:v.p,t1:v.t,f1:v.f,s:performance.now()};
}
function syncSph(){sph.setFromVector3(new THREE.Vector3().subVectors(cam.position,tgt));}
function applySph(){
  sph.radius=Math.min(16,Math.max(0.3,sph.radius));
  let maxPhi=Math.PI-0.05;const c=(0.12-tgt.y)/sph.radius;if(c>-1&&c<1)maxPhi=Math.min(maxPhi,Math.acos(c));
  sph.phi=Math.min(maxPhi,Math.max(0.02,sph.phi));
  cam.position.setFromSpherical(sph).add(tgt);cam.lookAt(tgt);applyCut();dirty=true;
}
function pan(dx,dy){
  cam.updateMatrix();
  const k=sph.radius*0.0016*(cam.fov/60),r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);
  tgt.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);
  tgt.x=Math.min(cur.W+0.5,Math.max(-0.5,tgt.x));tgt.y=Math.min(H,Math.max(0,tgt.y));tgt.z=Math.min(cur.D+0.5,Math.max(-0.5,tgt.z));
  applySph();
}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function showInfo(i){$('it').textContent=i.t;$('is').textContent=i.s;$('info').style.display='block';}
function hideInfo(){$('info').style.display='none';}
function pickAt(x,y){
  if(!cur)return;
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObject(cur.R,true);
  for(const h of hits){
    if(!h.object.layers.test(cam.layers)||!h.object.visible)continue;
    let o=h.object;while(o&&!o.userData.info&&!o.userData.winIdx)o=o.parent;
    if(o){
      let w=o;while(w&&!w.userData.winIdx)w=w.parent;
      if(w)toggleWin(w.userData.winIdx);
      if(o.userData.info)showInfo(o.userData.info);
      return;
    }
  }
  hideInfo();
}

/* ---------- overlay: si nasconde dopo 5 s di inattivita', torna al tocco successivo ---------- */
let idle=false,idleT=null,revealTap=false;
function armIdle(){
  clearTimeout(idleT);
  idleT=setTimeout(()=>{if($('home').hidden&&$('load').hidden){idle=true;document.body.classList.add('idle');}},5000);
}
function wakeUI(){
  if(idle){idle=false;document.body.classList.remove('idle');}
  armIdle();
}
['pointerdown','pointermove','pointerup','wheel','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,wakeUI,{passive:true}));
armIdle();

/* ---------- input ---------- */
const pts=new Map();let lastD=0,lastC=null,moved=0;
canvas.addEventListener('pointerdown',e=>{
  if(!cur)return;
  if(pts.size===0)revealTap=idle;
  canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tw){tw=null;}syncSph();
  if(pts.size===1)moved=0;
  if(pts.size===2){const q=[...pts.values()];lastD=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);lastC={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};moved=99;}
});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){sph.theta-=dx*0.006;sph.phi-=dy*0.006;applySph();}}
  else if(pts.size===2){
    const q=[...pts.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),c={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};
    if(lastD>0&&d>0)sph.radius*=lastD/d;
    if(lastC)pan(c.x-lastC.x,c.y-lastC.y);else applySph();
    lastD=d;lastC=c;
  }
});
const endPtr=e=>{
  if(pts.size===1&&moved<=4&&e.type==='pointerup'&&!revealTap)pickAt(e.clientX,e.clientY);
  pts.delete(e.pointerId);if(pts.size<2){lastD=0;lastC=null;}
};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{if(!cur)return;e.preventDefault();tw=null;syncSph();sph.radius*=Math.exp(e.deltaY*0.0012);applySph();},{passive:false});

/* ---------- controls ---------- */
/* distanza minima in pianta fra la sagoma reale dell'arredo e quella del box doccia */
function gapText(){
  let d=Infinity;cur.furn.forEach(p=>{d=Math.min(d,polyDist(p,cur.shower));});
  $('gap').textContent='Passaggio mobile\u2013doccia: '+(Math.round(d*1000)/10).toFixed(0)+' cm';
}
function labels(){
  const a=cur.anim;
  document.querySelectorAll('#cfgs button[data-cfg]').forEach(b=>b.classList.toggle('on',+b.dataset.cfg===curCfg));
  $('bDoor').classList.toggle('on',!!a.doorGoal);$('bDoor').textContent=a.doorGoal?'Chiudi box doccia':'Apri box doccia';
  $('bRoom').classList.toggle('on',!!a.rdGoal);$('bRoom').textContent=a.rdGoal?'Chiudi porta':'Apri porta';
  const wn=cur.winNames||[];
  [1,2].forEach(i=>{
    const b=$('bWin'+i);
    if(!wn[i-1]){b.style.display='none';return;}
    b.style.display='';
    const on=!!a['w'+i+'Goal'];
    b.classList.toggle('on',on);b.textContent=(on?'Chiudi ':'Apri ')+wn[i-1];
  });
  $('bNight').classList.toggle('on',night);
}
function toggleWin(i){
  if(!cur||!(cur.winAnim||[])[i-1])return;
  cur.anim['w'+i+'Goal']=cur.anim['w'+i+'Goal']?0:1;labels();
}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.v)));
$('bDoor').addEventListener('click',()=>{cur.anim.doorGoal=cur.anim.doorGoal?0:1;labels();});
$('bRoom').addEventListener('click',()=>{cur.anim.rdGoal=cur.anim.rdGoal?0:1;labels();});
[1,2].forEach(i=>$('bWin'+i).addEventListener('click',()=>toggleWin(i)));
function lightState(r){
  r.sun.intensity=night?0:1.5;r.hemi.intensity=night?0.05:0.3;r.spots.forEach(sp=>sp.intensity=night?r.nightI:r.dayI);r.vl.intensity=night?1.4:0.9;
  M.lampE.emissiveIntensity=night?2.2:1.6;M.led.emissiveIntensity=night?3:2.2;M.wash.opacity=night?0.75:0.3;M.washTop.opacity=night?0.5:0.22;
  scene.background.copy(night?NIGHT:DAY);M.winGlass.color.set(night?0x56606c:0xdfe9ee);
}
$('bNight').addEventListener('click',()=>{night=!night;lightState(cur);labels();updateShadows();capture();});
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;
  if(cur&&cur.views[curView].interior)cam.fov=viewParams(curView).f;
  cam.updateProjectionMatrix();dirty=true;
});

/* ---------- home page and room switching ---------- */
function openRoom(key,cfg,keepView){
  curKey=key;curCfg=cfg||1;
  const id=key+curCfg;
  $('load').textContent='Preparo il '+(key==='terra'?'bagno del piano terra':'bagno del primo piano')+', configurazione '+curCfg+'\u2026';$('load').hidden=false;
  const view=keepView&&cur?curView:'ingresso';
  setTimeout(()=>{
    try{
      if(!rooms[id]){const r=key==='terra'?buildTerra(curCfg):buildPrimo(curCfg);r.anim={doorT:0,doorGoal:0,rdT:0,rdGoal:0,w1T:0,w1Goal:0,w2T:0,w2Goal:0};rooms[id]=r;}
      for(const k in rooms)rooms[k].R.visible=(k===id);
      cur=rooms[id];R=cur.R;
      const a=cur.anim;a.doorT=a.doorGoal=a.rdT=a.rdGoal=0;a.w1T=a.w1Goal=a.w2T=a.w2Goal=0;
      cur.showerAnim(0);cur.doorAnim(0);(cur.winAnim||[]).forEach(f=>f(0));
      $('title').textContent=cur.title+' \u2014 config. '+curCfg;
      lightState(cur);labels();gapText();
      goView(view,true);
      updateShadows();capture();
      renderer.render(scene,cam);
      $('home').hidden=true;$('load').hidden=true;
    }catch(err){console.error(err);$('load').textContent='Errore nella preparazione del modello: '+err.message;}
  },60);
}
function openHome(){hideInfo();wakeUI();$('home').hidden=false;$('home').scrollTop=0;}
document.querySelectorAll('#home .card').forEach(b=>b.addEventListener('click',()=>openRoom(b.dataset.room,1)));
document.querySelectorAll('#cfgs button[data-cfg]').forEach(b=>b.addEventListener('click',()=>{const c=+b.dataset.cfg;if(c!==curCfg)openRoom(curKey,c,true);}));
$('bDxf').addEventListener('click',()=>{
  const name='bagno_'+(curKey==='terra'?'piano_terra':'primo_piano')+'_config'+curCfg+'.dxf';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([DXF[curKey+curCfg]],{type:'application/dxf'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  showInfo({t:'Disegno tecnico DXF',s:name+' \u2014 pianta e prospetti delle quattro pareti della configurazione visualizzata, in scala reale (unit\u00e0 cm)'});
});
$('bHome').addEventListener('click',openHome);

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(!cur||!$('home').hidden)return;
  if(tw){
    const k=Math.min(1,(now-tw.s)/900),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    cam.position.lerpVectors(tw.p0,tw.p1,e);tgt.lerpVectors(tw.t0,tw.t1,e);cam.fov=tw.f0+(tw.f1-tw.f0)*e;cam.updateProjectionMatrix();cam.lookAt(tgt);applyCut();dirty=true;
    if(k>=1){tw=null;syncSph();}
  }
  const a=cur.anim;
  if(a.doorT!==a.doorGoal){
    a.doorT=a.doorGoal>a.doorT?Math.min(a.doorGoal,a.doorT+dt/0.9):Math.max(a.doorGoal,a.doorT-dt/0.9);
    cur.showerAnim(ss(0,1,a.doorT));dirty=true;
    if(a.doorT===a.doorGoal){updateShadows();capture();}
  }
  if(a.rdT!==a.rdGoal){
    a.rdT=a.rdGoal>a.rdT?Math.min(a.rdGoal,a.rdT+dt/1.1):Math.max(a.rdGoal,a.rdT-dt/1.1);
    cur.doorAnim(ss(0,1,a.rdT));dirty=true;
    if(a.rdT===a.rdGoal){updateShadows();capture();}
  }
  for(let i=1;i<=2;i++){
    const fn=(cur.winAnim||[])[i-1];if(!fn)continue;
    const kt='w'+i+'T',kg='w'+i+'Goal';
    if(a[kt]!==a[kg]){
      a[kt]=a[kg]>a[kt]?Math.min(a[kg],a[kt]+dt/1.2):Math.max(a[kg],a[kt]-dt/1.2);
      fn(ss(0,1,a[kt]));dirty=true;
      if(a[kt]===a[kg]){updateShadows();capture();}
    }
  }
  if(dirty){renderer.render(scene,cam);dirty=false;}
}
$('load').hidden=true;
requestAnimationFrame(loop);
}
})();
</script>
</body>
